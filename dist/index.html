<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d08">
  <meta name="description" content="Cult of the Dead Bunnies. A terminal, a wagon, and a rabbit hole.">
  <title>COTDB — Cult of the Dead Bunnies</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23080d08'/%3E%3Ctext x='8' y='48' font-size='48' fill='%239fd49b'%3E%26%23355%3B%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="filesystem.js" defer></script>
  <script src="shell.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="terminal" aria-label="Cult of the Dead Bunnies terminal">
    <header class="terminal-header">
      <span class="terminal-name">COTDB <span class="separator">/</span> TERMINAL 01</span>
      <span id="system-status" class="system-status" role="status">BOOTING...</span>
    </header>

    <div id="terminal-output" class="terminal-output" role="log" aria-live="polite" aria-label="Terminal output">
      <p class="boot-line">Initializing terminal...</p>
      <noscript><p>JavaScript is required to use this terminal.</p></noscript>
    </div>

    <div id="terminal-controls" class="terminal-controls" hidden>
      <div class="shortcuts" aria-label="Quick commands">
        <span class="shortcut-label">QUICK PRESS:</span>
        <button type="button" data-command="help">[ help ]</button>
        <button type="button" data-command="files">[ files ]</button>
        <button type="button" data-command="map">[ map ]</button>
        <button type="button" data-command="travel">[ travel ]</button>
        <button type="button" data-command="rabbit">[ rabbit ]</button>
      </div>
      <form id="terminal-form" autocomplete="off">
        <label id="prompt-label" for="command-input">guest@warren:~$</label>
        <input id="command-input" name="command" type="text" maxlength="120" spellcheck="false" autocapitalize="off" aria-label="Type a terminal command" disabled>
        <button id="run-command" type="submit" aria-label="Run command" disabled>↵</button>
      </form>
    </div>
  </main>

  <template id="welcome-template">
    <div class="welcome">
      <p class="ready-line">COTDB SYSTEM READY <span aria-hidden="true">//</span> WELCOME TO THE WARREN</p>
      <img class="wagon" src="assets/bunny-wagon-v2.png" alt="White pixel-art bunny pulling a covered Oregon Trail wagon" width="1774" height="887">
      <h1>CULT OF THE DEAD BUNNIES<span class="cursor" aria-hidden="true">_</span></h1>
      <p>A bunny, a wagon, and a place for dial tones, hacker zines, and the old web.</p>
      <p class="hint">Type <strong>help</strong>, browse the files, or take the wagon down the trail.</p>
    </div>
  </template>
</body>
</html>
